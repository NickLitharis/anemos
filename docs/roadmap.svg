<svg viewBox="0 0 1020 180" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <title>Anemos milestone roadmap, AK0 to AK9</title>
  <line x1="60" y1="60" x2="960" y2="60" stroke="#d0d7de" stroke-width="3"/>
  <circle cx="60" cy="60" r="24" fill="#2da44e"/><text x="60" y="65" text-anchor="middle" font-size="14" fill="#ffffff">0</text>
  <circle cx="160" cy="60" r="24" fill="#2da44e"/><text x="160" y="65" text-anchor="middle" font-size="14" fill="#ffffff">1</text>
  <circle cx="260" cy="60" r="24" fill="#2da44e"/><text x="260" y="65" text-anchor="middle" font-size="14" fill="#ffffff">2</text>
  <circle cx="360" cy="60" r="24" fill="#2da44e"/><text x="360" y="65" text-anchor="middle" font-size="14" fill="#ffffff">3</text>
  <circle cx="460" cy="60" r="24" fill="#2da44e"/><text x="460" y="65" text-anchor="middle" font-size="14" fill="#ffffff">4</text>
  <circle cx="560" cy="60" r="24" fill="#2da44e"/><text x="560" y="65" text-anchor="middle" font-size="14" fill="#ffffff">5</text>
  <circle cx="660" cy="60" r="24" fill="#d4a72c"/><text x="660" y="65" text-anchor="middle" font-size="14" fill="#1f2328">6</text>
  <circle cx="760" cy="60" r="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/><text x="760" y="65" text-anchor="middle" font-size="14" fill="#1f2328">7</text>
  <circle cx="860" cy="60" r="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/><text x="860" y="65" text-anchor="middle" font-size="14" fill="#1f2328">8</text>
  <circle cx="960" cy="60" r="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/><text x="960" y="65" text-anchor="middle" font-size="14" fill="#1f2328">9</text>
  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <text x="60" y="110">provenance</text>
    <text x="160" y="110">boot</text>
    <text x="260" y="110">CPU</text>
    <text x="360" y="110">memory</text>
    <text x="460" y="110">threads</text>
    <text x="560" y="110">processes</text>
    <text x="660" y="110">services</text>
    <text x="760" y="110">I/O, drivers</text>
    <text x="860" y="110">XP ABI</text>
    <text x="960" y="110">network</text>
  </g>
  <g font-size="13" fill="#57606a">
    <circle cx="60" cy="150" r="7" fill="#2da44e"/><text x="75" y="155">gated</text>
    <circle cx="160" cy="150" r="7" fill="#d4a72c"/><text x="175" y="155">partial</text>
    <circle cx="280" cy="150" r="7" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/><text x="295" y="155">not started</text>
  </g>
</svg>
